<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="망상동 심곡동">
<rect width="800" height="1000" fill="#FFFFFF"/>
<g>
<text x="400" y="90" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="700" fill="#101010">망상동 심곡동</text>
<text x="400" y="130" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45">재난취약자 대피계획서 (가상 서식)</text>
<line x1="48" y1="160" x2="752" y2="160" stroke="#3D3F45" stroke-width="2"/>
<rect x="48" y="200" width="704" height="60" fill="#F8F9FB" stroke="#9A9EA5"/>
<text x="98" y="238" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#101010">순번</text>
<text x="380" y="238" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#101010">거동 상태</text>
<text x="660" y="238" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#101010">비고</text>
<line x1="148" y1="200" x2="148" y2="840" stroke="#9A9EA5"/>
<line x1="580" y1="200" x2="580" y2="840" stroke="#9A9EA5"/>
<rect x="48" y="300" width="704" height="120" fill="none" stroke="#9A9EA5"/>
<text x="98" y="368.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" fill="#101010">1</text>
<text x="168" y="356.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">거동 상태 누워서만 생활함</text>
<text x="168" y="384.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">산소발생기 사용 보호자 동행 필요</text>
<text x="600" y="368.0" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45">와상</text>
<rect x="48" y="440" width="704" height="120" fill="none" stroke="#9A9EA5"/>
<text x="98" y="508.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" fill="#101010">2</text>
<text x="168" y="496.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">거동 상태 휠체어 사용</text>
<text x="168" y="524.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">혼자 이동 어려움</text>
<text x="600" y="508.0" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45"></text>
<rect x="48" y="580" width="704" height="120" fill="none" stroke="#9A9EA5"/>
<text x="98" y="648.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" fill="#101010">3</text>
<text x="168" y="636.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">거동 상태 지팡이 짚고</text>
<text x="168" y="664.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">부축 받으면 이동 가능</text>
<text x="600" y="648.0" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45"></text>
<rect x="48" y="720" width="704" height="120" fill="none" stroke="#9A9EA5"/>
<text x="98" y="788.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" fill="#101010">4</text>
<text x="168" y="776.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">거동 상태 혼자 걸을 수 있음</text>
<text x="168" y="804.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">청력 약함</text>
<text x="600" y="788.0" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45"></text>
<text x="48" y="960" font-family="Pretendard, sans-serif" font-size="16" fill="#6B6F76">가상 데이터. 실제 개인정보 없음. 이름과 연락처 칸은 지자체 서버 보관</text>
</g></svg>