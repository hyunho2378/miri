<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="삼화동 이로동">
<rect width="800" height="1000" fill="#FFFFFF"/>
<defs><filter id="blur"><feGaussianBlur stdDeviation="0.9"/></filter></defs>
<rect width="800" height="1000" fill="#DDE1E6" opacity="0.35"/>
<g opacity="0.55" filter="url(#blur)">
<text x="400" y="90" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="30" font-weight="700" fill="#101010">삼화동 이로동</text>
<text x="400" y="130" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45">재난취약자 대피계획서 (가상 서식)</text>
<line x1="48" y1="160" x2="752" y2="160" stroke="#3D3F45" stroke-width="2"/>
<rect x="48" y="200" width="704" height="60" fill="#F8F9FB" stroke="#9A9EA5"/>
<text x="98" y="238" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#101010">순번</text>
<text x="380" y="238" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#101010">거동 상태</text>
<text x="660" y="238" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="20" font-weight="700" fill="#101010">비고</text>
<line x1="148" y1="200" x2="148" y2="680" stroke="#9A9EA5"/>
<line x1="580" y1="200" x2="580" y2="680" stroke="#9A9EA5"/>
<rect x="48" y="360" width="704" height="140" fill="none" stroke="#9A9EA5"/>
<text x="98" y="438.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" fill="#101010">1</text>
<text x="168" y="426.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">거동 상태 보행기 이용</text>
<text x="168" y="454.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">천천히 이동</text>
<text x="600" y="438.0" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45"></text>
<rect x="48" y="540" width="704" height="140" fill="none" stroke="#9A9EA5"/>
<text x="98" y="618.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="22" fill="#101010">2</text>
<text x="168" y="618.0" font-family="Pretendard, sans-serif" font-size="21" fill="#101010">거동 상태 판독 불가</text>
<text x="600" y="618.0" font-family="Pretendard, sans-serif" font-size="18" fill="#3D3F45">얼룩</text>
<text x="48" y="960" font-family="Pretendard, sans-serif" font-size="16" fill="#6B6F76">가상 데이터. 실제 개인정보 없음. 이름과 연락처 칸은 지자체 서버 보관</text>
</g></svg>